<ion-accordion value="create-event">
  <ion-item slot="header" color="light">
    <ion-label>createEvent</ion-label>
  </ion-item>
  <div class="ion-padding method-options" slot="content">
    <ion-item lines="none" class="ion-no-padding">
      <ion-input
        id="create-event-title-input"
        label="Title"
        label-placement="stacked"
        value="Recurring standup"
      ></ion-input>
    </ion-item>
    <ion-item lines="none" class="ion-no-padding">
      <div slot="start" id="create-event-color-swatch" class="color-swatch" aria-hidden="true"></div>
      <ion-select
        id="create-event-color-select"
        class="color-select"
        data-color-preset="event"
        data-swatch="create-event-color-swatch"
        data-omit-title="Color omitted"
        label="Color"
        label-placement="stacked"
        interface="popover"
        value=""
        helper-text="Android hex only. Values that do not start with # are omitted; invalid hex is still sent."
      ></ion-select>
    </ion-item>
  </div>
</ion-accordion>
