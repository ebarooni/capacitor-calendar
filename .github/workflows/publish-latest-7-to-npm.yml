name: Publish Cap 7 package to npm

# Capacitor 7 maintenance line (branch 7.x).
# Mirrors the former Cap 5 LTS publish (`latest-5`): npm dist-tag only.
# Does not create git tags, GitHub Releases, docs deploys, or MCP/Docker publishes.

on:
  workflow_dispatch:

jobs:
  publish:
    if: github.ref == 'refs/heads/7.x'
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: 7.x

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish package with latest-7 tag
        run: npm publish --tag latest-7 --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_GITHUB_CICD }}

      - name: Get package version
        id: pkg
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "Published @ebarooni/capacitor-calendar@$VERSION with dist-tag latest-7"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
